services:
  - type: web
    name: autonomous-defect-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT run:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: defect-ai-db
          property: connectionString

databases:
  - name: defect-ai-db
    plan: free
    databaseName: defect_ai
    user: defect_ai
